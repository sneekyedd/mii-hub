# Builds the Mii Hub desktop app for Windows, Mac and Linux, then puts the
# installers on the repository's Releases page so they can be downloaded.
# Runs every time code is pushed (or when started by hand from the Actions tab).
name: Build desktop app

on:
  push:
    branches: [main, claude/magical-goodall-vsocgg]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Built-in online Paintball server (from the PAINTBALL_SERVER secret, if there is one)
        run: node scripts/write-pb-config.js
        env:
          PAINTBALL_SERVER: ${{ secrets.PAINTBALL_SERVER }}

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # the app isn't code-signed

      - uses: actions/upload-artifact@v4
        with:
          name: mii-hub-${{ matrix.os }}
          # the installers, plus the files the app reads to find updates
          # (latest.yml for Windows, latest-linux.yml for Linux, and .blockmap
          # files that let updates download only the parts that changed)
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    # publish whatever was built, even if one computer type had a problem
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # The version number is the "version" in package.json, set by hand for each update:
      # bigger updates bump the middle number (1.1.0 -> 1.2.0), small ones the last (1.1.0 -> 1.1.1).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version number
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          # a version can only be released once (otherwise installed apps wouldn't see the update)
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null && [ "$(git rev-list -n 1 "v$V")" != "$GITHUB_SHA" ]; then
            echo "::error::Version $V was already released. Bump \"version\" in package.json."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # never publish a release with nothing in it (installed apps would fail to check for updates)
      - name: Check something was built
        run: |
          if ! ls out/latest*.yml >/dev/null 2>&1; then
            echo "::error::No installers were built, so nothing is released. Check the build jobs above."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Mii Hub ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: false
          files: out/*
          body: |
            ## Download Mii Hub

            Pick the file for your computer from **Assets** below:

            | Computer | File |
            | --- | --- |
            | Windows | `Mii-Hub-Setup-${{ steps.ver.outputs.v }}.exe` |
            | Mac (Intel or Apple Silicon) | `Mii-Hub-${{ steps.ver.outputs.v }}-mac.dmg` |
            | Linux | `Mii-Hub-${{ steps.ver.outputs.v }}-linux.AppImage` |

            **Windows:** run the Setup file. If Windows says *"Windows protected your PC"*, click **More info** → **Run anyway** (this shows up because the app isn't signed with a paid certificate).

            **Mac:** open the .dmg and drag **Mii Hub** into **Applications**. The first time, right-click the app → **Open** → **Open**. If macOS says it's damaged or can't be opened, go to **System Settings → Privacy & Security** and click **Open Anyway**.

            **Linux:** make the file executable (`chmod +x Mii-Hub-*.AppImage`) and double-click it.

            **Already have Mii Hub installed?** You don't need this page: the app checks for updates by itself and asks if you'd like to update (Windows and Linux install it for you; on Mac it opens this page).
